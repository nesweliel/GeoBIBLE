name: Consolidate GeoBIBLE Runtime

on:
  push:
    branches: [consolidate-v1-final]

permissions:
  contents: write

jobs:
  connect-canonical-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-v1-final
          fetch-depth: 0

      - name: Connect canonical 187-state register to React runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          canonical = Path('app/src/data/canonicalStates.ts')
          canonical.write_text("""import rawStates from '../../../data/states/actor-period-states.v1.json'\nimport actors1 from '../../../data/master/actors.v1.part1.json'\nimport actors2 from '../../../data/master/actors.v1.part2.json'\nimport actors3 from '../../../data/master/actors.v1.part3.json'\nimport actors4 from '../../../data/master/actors.v1.part4.json'\n\nexport interface ActorPeriodState {\n  period: string\n  actor_id: string\n  status: string\n  core_control: string\n  influence: string\n  contested: string\n  allies: string\n  enemies: string\n  interest: string\n  visibility_scale: string\n  certainty: string\n  notes: string\n  sources?: string\n}\n\ntype CanonicalActor = { id: string; name: string }\n\nexport const actorPeriodStates = rawStates as ActorPeriodState[]\nconst canonicalActors = [...actors1, ...actors2, ...actors3, ...actors4] as CanonicalActor[]\nconst actorNames = new Map(canonicalActors.map(actor => [actor.id, actor.name]))\n\nexport const statesForPeriod = (period: string) => actorPeriodStates.filter(state => state.period === period)\nexport const canonicalActorName = (actorId: string) => actorNames.get(actorId) ?? actorId\n""", encoding='utf-8')

          app = Path('app/src/App.tsx')
          text = app.read_text(encoding='utf-8')
          import_line = "import { actorById, actors, locationById, locations, periods, routes } from './data/atlasData'\n"
          if "./data/canonicalStates" not in text:
              text = text.replace(import_line, import_line + "import { actorPeriodStates, canonicalActorName, statesForPeriod, type ActorPeriodState } from './data/canonicalStates'\n")

          actor_list_line = "  const actorList = useMemo(() => period.actorIds.map(id => actorById.get(id)).filter((actor): actor is HistoricalActor => Boolean(actor)), [period])\n"
          if "const temporalStates = useMemo" not in text:
              text = text.replace(actor_list_line, actor_list_line + "  const temporalStates = useMemo(() => statesForPeriod(period.id), [period.id])\n")

          search_marker = "  const chooseSearchResult = (result: SearchResult) => {\n"
          if "const chooseTemporalState" not in text:
              helper = """  const chooseTemporalState = (state: ActorPeriodState) => {\n    setSelected({\n      title: canonicalActorName(state.actor_id),\n      subtitle: state.status,\n      body: `גרעין שליטה: ${state.core_control}\\nהשפעה: ${state.influence}\\nמחלוקת: ${state.contested}\\n\\nאינטרס: ${state.interest}${state.notes ? `\\n\\nהערה: ${state.notes}` : ''}`,\n      confidence: state.certainty,\n    })\n  }\n\n"""
              text = text.replace(search_marker, helper + search_marker)

          old_grid = "<div className=\"situation-grid\"><div><span>קנה מידה</span><strong>{period.scale}</strong></div><div><span>שחקנים פעילים</span><strong>{actorList.length}</strong></div><div><span>מוקדים</span><strong>{period.locationIds.length}</strong></div><div><span>שכבות GIS</span><strong>{ZONES[period.id]?.length ?? 0}</strong></div></div>"
          new_grid = "<div className=\"situation-grid\"><div><span>קנה מידה</span><strong>{period.scale}</strong></div><div><span>שחקנים פעילים</span><strong>{actorList.length}</strong></div><div><span>מצבי זמן קנוניים</span><strong>{temporalStates.length}</strong></div><div><span>מוקדים</span><strong>{period.locationIds.length}</strong></div><div><span>שכבות GIS</span><strong>{ZONES[period.id]?.length ?? 0}</strong></div></div>"
          text = text.replace(old_grid, new_grid)

          old_explore = ": <><div className=\"section-title\">שחקנים בתקופה</div><div className=\"actor-list\">{actorList.map(actor => <button key={actor.id} onClick={() => setSelected(selectActor(actor))}><strong>{actor.name}</strong><span>{actor.category}</span><em>{actor.status}</em></button>)}</div></>}"
          new_explore = ": <><div className=\"section-title\">שחקנים בתקופה</div><div className=\"actor-list\">{actorList.map(actor => <button key={actor.id} onClick={() => setSelected(selectActor(actor))}><strong>{actor.name}</strong><span>{actor.category}</span><em>{actor.status}</em></button>)}</div><div className=\"section-title\">רשם מצב קנוני</div><div className=\"actor-list temporal-state-list\">{temporalStates.map((state, index) => <button key={`${state.actor_id}-${index}`} onClick={() => chooseTemporalState(state)}><strong>{canonicalActorName(state.actor_id)}</strong><span>{state.status}</span><em>{state.core_control} · {state.interest}</em></button>)}</div></>}"
          text = text.replace(old_explore, new_explore)

          old_footer = "<footer className=\"footerbar\"><span>GeoBIBLE V1</span><span>{actors.length} runtime actors · {locations.length} geocoded records · {periods.length} master states</span><span>OpenFreeMap © OpenMapTiles · Data from OpenStreetMap</span></footer>"
          new_footer = "<footer className=\"footerbar\"><span>GeoBIBLE V1</span><span>{actors.length} runtime actors · {actorPeriodStates.length} canonical temporal states · {locations.length} geocoded records · {periods.length} master periods</span><span>OpenFreeMap © OpenMapTiles · Data from OpenStreetMap</span></footer>"
          text = text.replace(old_footer, new_footer)
          app.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          source_marker = "            app/src\n"
          if "data/states/actor-period-states.v1.json" not in ci_text:
              ci_text = ci_text.replace(source_marker, source_marker + "            data/states/actor-period-states.v1.json\n            data/master/actors.v1.part1.json\n            data/master/actors.v1.part2.json\n            data/master/actors.v1.part3.json\n            data/master/actors.v1.part4.json\n")
          ci.write_text(ci_text, encoding='utf-8')
          PY

      - name: Commit runtime consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/data/canonicalStates.ts app/src/App.tsx .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "Connect V1 runtime to canonical 187-state register"
            git push origin HEAD:consolidate-v1-final
          fi
