name: Consolidate GeoBIBLE Data Freeze

on:
  push:
    branches: [consolidate-v1-final]

permissions:
  contents: write

jobs:
  import-canonical-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-v1-final
          fetch-depth: 0

      - name: Restore all 187 canonical actor-period states
        env:
          STATES_GZ_B64: 
        run: |
          python - <<'PY'
          import os, base64, gzip, json
          from pathlib import Path

          raw = gzip.decompress(base64.b64decode(os.environ['STATES_GZ_B64']))
          states = json.loads(raw.decode('utf-8'))
          assert len(states) == 187, len(states)

          states_path = Path('data/states/actor-period-states.v1.json')
          states_path.write_text(json.dumps(states, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator = Path('app/scripts/validate-data.mjs')
          text = validator.read_text(encoding='utf-8')
          if "const statesDir = path.join(root, 'data/states')" not in text:
              text = text.replace("const master = path.join(root, 'data/master')\n", "const master = path.join(root, 'data/master')\nconst statesDir = path.join(root, 'data/states')\n")
              text = text.replace("const sources = read('sources.v1.json')\n", "const sources = read('sources.v1.json')\nconst states = JSON.parse(fs.readFileSync(path.join(statesDir, 'actor-period-states.v1.json'), 'utf8'))\n")
              text = text.replace("  sources: [sources, 28],\n", "  sources: [sources, 28],\n  states: [states, 187],\n")
              marker = "for (const id of requiredPeriods) if (!periodIds.has(id)) errors.push(`missing canonical period: ${id}`)\n"
              state_validation = """\n\nfor (const [index, state] of states.entries()) {\n  if (!periodIds.has(state.period)) errors.push(`state ${index}: unknown period ${state.period}`)\n  if (!actorIds.has(state.actor_id)) errors.push(`state ${index}: unknown actor ${state.actor_id}`)\n  if (!state.status || !state.interest || !state.visibility_scale || !state.certainty) {\n    errors.push(`state ${index}: missing required temporal fields`)\n  }\n}\n\nconst leviState = states.find(state => state.period === 'P02' && state.actor_id === 'A014' && String(state.notes).includes('ללא פוליגון'))\nif (!leviState) errors.push('Actor-period states must preserve non-territorial Levi state')\nconst danMigrationState = states.find(state => state.period === 'P03F' && state.actor_id === 'A010')\nif (!danMigrationState || !String(danMigrationState.core_control).includes('ליש')) errors.push('Actor-period states must preserve Dan migration')\nconst p08Jebus = states.find(state => state.period === 'P08' && state.actor_id === 'A025' && state.status === 'עצמאית')\nif (!p08Jebus) errors.push('Actor-period states must preserve independent Jebusite Jerusalem in P08')\n"""
              text = text.replace(marker, marker + state_validation)
              text = text.replace("  sources: sources.length,\n", "  sources: sources.length,\n  actorPeriodStates: states.length,\n")
              validator.write_text(text, encoding='utf-8')

          readme = Path('data/states/README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('`actor-period-states.v1.json` is the first canonical migration of the research state model. Additional macro and local states can be appended only if their actor IDs and period IDs already exist in the canonical registries.', '`actor-period-states.v1.json` contains the complete Data Freeze v1 temporal state register: exactly **187 actor-period state records**. The CI data contract validates this exact count and all actor/period foreign keys. Runtime code should treat this file as the canonical temporal source of truth.')
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Commit canonical freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/states/actor-period-states.v1.json data/states/README.md app/scripts/validate-data.mjs
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Consolidate complete 187-state Data Freeze"
            git push origin HEAD:consolidate-v1-final
          fi
